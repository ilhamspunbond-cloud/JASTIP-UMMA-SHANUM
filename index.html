<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jastip Umma Shanum</title>
    <!-- Pemanggilan File CSS (Cukup 1 kali di sini) -->
    <link rel="stylesheet" href="animasi_pembuka.css">
</head>
<body>

    <!-- Bagian Splash Screen & Video -->
    <div id="splash-screen" class="splash-screen">
        
        <!-- Video Sambutan -->
        <video id="intro-video" autoplay muted playsinline>
            <!-- Sumber video akan otomatis diisi dari pengaturan Admin jika sudah diubah -->
            <source id="video-source" src="jastip_intro.mp4.mp4" type="video/mp4">
            Browser tidak mendukung pemutaran video.
        </video>

        <!-- Tombol Interaktif (Muncul khusus untuk pengguna pertama) -->
        <div id="auth-buttons" class="auth-container" style="display: none;">
            <h2>Selamat Datang di Jastip Umma Shanum</h2>
            <a href="register.html" class="btn btn-primary">Lanjutkan (Daftar Akun)</a>
            <a href="login.html" class="btn btn-secondary">Sudah Punya Akun (Masuk)</a>
        </div>

        <!-- Tombol Roda Gigi (Pintu Rahasia Menuju admin.html) - Posisi yang benar di dalam body -->
        <a href="admin.html" class="secret-gear-btn" title="Admin Panel">⚙️</a>
    </div>

    <!-- Script JavaScript untuk Cek Video Admin & Alur Pengguna -->
    <script>
        // 1. CEK APAKAH ADMIN SUDAH MENGUBAH VIDEO LEWAT DASHBOARD ADMIN
        const customVideoUrl = localStorage.getItem('jastip_custom_video');
        if (customVideoUrl) {
            const videoSource = document.getElementById('video-source');
            const videoElement = document.getElementById('intro-video');
            videoSource.src = customVideoUrl;
            videoElement.load(); // Muat ulang video dengan link baru dari admin
        }

        // 2. LOGIKA UTAMA: PENGGUNA PERTAMA VS PENGGUNA LAMA
        const video = document.getElementById('intro-video');
        const authButtons = document.getElementById('auth-buttons');
        const sudahPernahBuka = localStorage.getItem('jastip_sudah_buka');

        video.onended = function() {
            if (!sudahPernahBuka) {
                localStorage.setItem('jastip_sudah_buka', 'true');
                authButtons.style.display = 'flex'; 
            } else {
                window.location.href = 'dashboard.html'; 
            }
        };

        // Jaga-jaga jika autoplay diblokir browser
        video.addEventListener('error', function() {
            if (!sudahPernahBuka) {
                localStorage.setItem('jastip_sudah_buka', 'true');
                authButtons.style.display = 'flex';
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
